services:
  sample:
    build:
      context: .
      dockerfile: Dockerfile.sampling
    image: video-ai-thesis
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
      - ./main.py:/app/main.py
    entrypoint: ["python", "main.py"]

  segment:
    build:
      context: .
      dockerfile: Dockerfile.segmentation
    image: video-ai-thesis-segmentation
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    environment:
      # torch.hub cache for OmniShotCut's pretrained ResNet-18 backbone; lives on
      # the mounted models/ volume so it is downloaded once, not every run.
      TORCH_HOME: /app/models/segmentation
    entrypoint: ["python", "-m", "src.segmentation"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  associate:
    build:
      context: .
      dockerfile: Dockerfile.association
    image: video-ai-thesis-association
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    entrypoint: ["python", "-m", "src.association"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
